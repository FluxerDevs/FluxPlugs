<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="5;url=https://beta.fluxer.plus" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Redirecting...</title>
    <style>
      :root {
        --canvas: #121016;
        --surface-2: #1c1922;
        --hairline: #342d3e;
        --ink: #f1edf6;
        --ink-muted: #bbb1c8;
        --link: #b980ff;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --canvas: #fcfaff;
          --surface-2: #ffffff;
          --hairline: #d8cfe2;
          --ink: #24192f;
          --ink-muted: #51435e;
          --link: #6216ac;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Fluxer Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      main {
        width: 100%;
        max-width: 28rem;
        padding: 32px;
        background: var(--surface-2);
        border: 1px solid var(--hairline);
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.2;
        letter-spacing: -0.6px;
      }

      p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 16px;
        line-height: 1.7;
      }

      #count {
        font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, monospace;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }

      a {
        color: var(--link);
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FluxPlugs is in development!</h1>
      <p>
        Redirecting to <a href="https://beta.fluxer.plus">beta.fluxer.plus</a> in
        <span id="count">5</span> <span id="unit">seconds</span>...
      </p>
    </main>
    <script>
      let remaining = 5;
      const count = document.getElementById("count");
      const unit = document.getElementById("unit");
      const timer = setInterval(() => {
        remaining = Math.max(remaining - 1, 0);
        count.textContent = remaining;
        unit.textContent = remaining === 1 ? "second" : "seconds";
        if (remaining === 0) clearInterval(timer);
      }, 1000);
    </script>
  </body>
</html>
